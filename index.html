<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="野帳">
<meta name="theme-color" content="#16467f">
<title>野帳アプリ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#eef1ed;--paper:#fff;--ink:#16201b;--sub:#66726b;--line:#dfe4de;
  --acc:#1d5fa8;--acc-d:#123f73;--acc-l:#e6eff9;--red:#d8342f;--blue:#2563d9;--amber:#e8a10b;
  --sh1:0 1px 2px rgba(16,32,24,.06),0 4px 14px rgba(16,32,24,.07);
  --sh2:0 2px 6px rgba(16,32,24,.10),0 12px 32px rgba(16,32,24,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;font-size:16px;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 14px;min-height:44px;cursor:pointer;transition:background .15s,transform .08s,box-shadow .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:active{transform:scale(.97)}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
button.ghost{background:transparent;border-color:transparent}
button.warn{color:#b3261e;border-color:#f0cdc9}
button:disabled{opacity:.35}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;min-height:44px;color:var(--ink)}
input:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-l)}
.hide{display:none!important}

/* ---------- ホーム ---------- */
#home{min-height:100%}
.hero{background:linear-gradient(135deg,#0e2f57 0%,#16467f 55%,#1d5fa8 100%);color:#fff;padding:calc(28px + env(safe-area-inset-top)) 20px 64px}
.hero .in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:16px}
.logo{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.14);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.logo svg{width:32px;height:32px;stroke:#fff}
.hero h1{margin:0;font-size:26px;letter-spacing:.04em}
.hero p{margin:4px 0 0;opacity:.82;font-size:14px;line-height:1.5}
.wrap{max-width:860px;margin:-40px auto 0;padding:0 16px 48px}
.hbtns{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.hbtns button{min-height:50px;padding:10px 18px;box-shadow:var(--sh1)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pitem{background:var(--paper);border-radius:18px;padding:16px;box-shadow:var(--sh1);display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.pitem .nm{font-weight:700;font-size:18px;word-break:break-all;padding-right:8px}
.pitem .meta{color:var(--sub);font-size:13px}
.bar{height:8px;border-radius:8px;background:#edf0ec;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#3b82d6,#1d5fa8);border-radius:8px}
.pstat{display:flex;justify-content:space-between;font-size:13px;color:var(--sub)}
.pstat b{color:var(--acc);font-size:15px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;background:var(--acc-l);color:var(--acc);border-radius:20px;padding:3px 10px;font-weight:600}
.pitem .acts{display:flex;gap:8px}
.pitem .acts .pri{flex:1}
.empty{grid-column:1/-1;background:var(--paper);border-radius:18px;padding:36px 20px;text-align:center;color:var(--sub);box-shadow:var(--sh1);line-height:1.7}
.empty svg{width:44px;height:44px;stroke:var(--acc);margin-bottom:6px}
.sets{margin-top:20px;background:var(--paper);border-radius:18px;padding:16px;box-shadow:var(--sh1)}
.sets h2{font-size:15px;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.sets label{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid #f0f2ef;flex-wrap:wrap}
.sets label:first-of-type{border-top:0}
.sw{position:relative;width:52px;height:32px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:#d6dbd5;border-radius:32px;transition:.2s}
.sw span:before{content:"";position:absolute;width:26px;height:26px;left:3px;top:3px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.sw input:checked+span{background:var(--acc)}
.sw input:checked+span:before{transform:translateX(20px)}

/* ---------- 図面 ---------- */
#work{position:fixed;inset:0;background:#e3e7e2}
#wtop{position:absolute;left:0;right:0;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:rgba(255,255,255,.86);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid rgba(0,0,0,.06)}
#wtop .ttl{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22vw}
#backbtn{padding:6px 10px 6px 6px;min-height:40px}
#tabs{display:flex;gap:2px;flex:1;overflow-x:auto;background:#eceeeb;border-radius:12px;padding:3px;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{white-space:nowrap;min-height:34px;padding:4px 14px;border:0;background:transparent;border-radius:9px;font-size:14px;color:var(--sub)}
#tabs button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.prog{white-space:nowrap;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:76px}
.prog b{color:var(--acc);font-size:15px}
.prog .bar{width:76px;height:5px}
#outbtn{min-height:40px;padding:6px 14px}
#stage{position:absolute;inset:0;overflow:hidden;touch-action:none}
#cv,#cv2{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#cv{transform-origin:0 0;will-change:transform}
#upd{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9999;background:#1f7a4d;color:#fff;border-radius:22px;padding:10px 16px;font-size:15px;box-shadow:0 4px 16px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center}
#upd button{background:#fff;color:#1f7a4d;border:0;border-radius:16px;padding:6px 14px;font-weight:bold;font-size:15px}
#upd .no{background:transparent;color:#fff;padding:6px 6px}

/* 道具のバー(グッドノートのように上に並ぶ) */
#wtop{flex-direction:column;align-items:stretch;gap:6px}
#wtop .row1{display:flex;align-items:center;gap:8px}
#tools{display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
#tools::-webkit-scrollbar{display:none}
#tools .tg{display:flex;align-items:center;gap:2px;flex:none}
#tools .flex{flex:1}
#tools .sep{width:1px;height:30px;background:var(--line);flex:none;margin:0 4px}
#tools button{border:0;background:transparent;min-width:52px;min-height:46px;padding:3px 6px;flex-direction:column;gap:1px;font-size:10px;color:#4b5650;border-radius:12px;white-space:nowrap}
#tools button.ib{min-width:44px}
#tools .main button.on{background:var(--acc);color:#fff}
#tools .main button.on svg.i{stroke:#fff}
#opts button{min-width:40px}
#opts .cdot{width:26px;height:26px;border-radius:50%;display:block;border:2px solid #fff;box-shadow:0 0 0 1px #c9cfc8}
#opts button.on .cdot{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--acc)}
#opts .wdot{display:flex;align-items:center;justify-content:center;width:28px;height:28px}
#opts .wdot i{display:block;border-radius:50%;background:#33403a}
#opts button.on .wdot{background:var(--acc-l);border-radius:50%;box-shadow:0 0 0 2px var(--acc)}
#opts button.sym{min-width:56px}
#opts button.sym.on{background:var(--acc-l);box-shadow:inset 0 0 0 2px var(--acc);color:var(--acc);font-weight:700}
#opts img{width:40px;height:24px}
#opts .olbl{font-size:10px;color:var(--sub)}
#hint{position:absolute;left:50%;top:calc(124px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(18,63,115,.94);color:#fff;padding:10px 18px;border-radius:24px;font-size:14px;pointer-events:none;max-width:90%;text-align:center;z-index:25;box-shadow:var(--sh2)}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(22,32,27,.94);color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;z-index:80;max-width:90%;box-shadow:var(--sh2)}

/* その場の小さい画面 */
#pop{max-height:calc(100% - 140px);overflow:auto;-webkit-overflow-scrolling:touch;position:absolute;z-index:40;background:#fff;border-radius:20px;box-shadow:var(--sh2);padding:12px;width:min(470px,calc(100% - 16px));touch-action:manipulation;border:1px solid rgba(0,0,0,.05)}
#pop .ph{font-weight:800;font-size:16px;margin:0 0 8px 4px;display:flex;align-items:center;gap:6px}
#pop .ph .x{margin-left:auto;min-height:34px;min-width:34px;padding:0;border:0;background:#f0f2ef;border-radius:50%}
#pop .it{margin:4px 0 8px;background:#f6f8f5;border-radius:14px;padding:8px 10px}
#pop .it .nm{font-size:14px;margin-bottom:6px;font-weight:600}
#pop .grades button{min-width:0;flex:1;min-height:46px}
#pop .ok{width:100%;font-size:18px;min-height:56px;margin-top:4px;border-radius:16px;box-shadow:0 4px 14px rgba(29,95,168,.3)}
#pop .row2{display:flex;gap:6px;margin-top:8px}
#pop .row2 button{flex:1;font-size:14px;padding:6px;min-height:46px}
#pop .ids{font-size:13px;color:var(--acc);margin:8px 4px 0;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#pop .addl{display:flex;gap:6px;margin-top:8px}
#pop .addl input{flex:1;min-width:0}
#pop textarea{width:100%;min-height:96px;font-size:17px;resize:vertical;background:#fffbe6;border-color:#f1dd8a}

/* 要素・状況写真 */
#elbtn{min-height:40px;padding:6px 12px;white-space:nowrap}
#inkbtn{position:relative}
#inkbtn .cnt{position:absolute;top:0;right:0;background:var(--red);color:#fff;border-radius:10px;padding:0 6px;font-size:11px;line-height:16px}
#elbtn .cnt{background:var(--red);color:#fff;border-radius:12px;padding:1px 8px;font-size:12px;min-width:22px}
#elbtn .cnt.ok{background:var(--acc)}
#elpanel{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column}
.elhead{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.seg{display:flex;background:#eceeeb;border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;min-height:36px;border-radius:9px;font-size:14px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
#elclose{margin-left:auto}
.elbody{flex:1;display:flex;min-height:0}
#ellist{flex:1 1 52%;overflow:auto;padding:12px 14px 40px;-webkit-overflow-scrolling:touch}
#elfig{flex:1 1 48%;display:flex;flex-direction:column;border-left:1px solid var(--line);background:#dfe3de;min-width:0}
@media (max-width:820px) and (orientation:portrait){.elbody{flex-direction:column}#elfig{border-left:0;border-top:1px solid var(--line);flex:0 0 42%}}
.figbar{display:flex;gap:6px;align-items:center;padding:6px 8px;background:#fff;border-bottom:1px solid var(--line)}
.figbar .sp{flex:1}.figbar button{min-height:36px;padding:4px 10px}
.figbar select{min-height:36px;max-width:50%}
#figwrap{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
#figimg{display:block;width:100%;height:auto;background:#fff}
.mg{background:#fff;border-radius:16px;box-shadow:var(--sh1);padding:10px 12px;margin-bottom:10px}
.mg .mh{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:700}
.mg .mh .sym{background:var(--acc-l);color:var(--acc);border-radius:8px;padding:1px 8px;font-size:13px}
.mg .mh .n{font-weight:500;font-size:13px;color:var(--sub)}
.mg .mh button{margin-left:auto;min-height:34px;font-size:13px;padding:4px 10px}
.els{display:flex;flex-wrap:wrap;gap:6px}
.elc{min-width:64px;min-height:44px;padding:4px 8px;font-weight:700;font-size:15px;border-radius:12px;flex-direction:column;gap:0;line-height:1.1}
.elc small{font-size:10px;font-weight:500}
.elc.todo{background:#fff;border:2px dashed #c4cbc3;color:#5b665f}
.elc.non{background:var(--acc);border-color:var(--acc);color:#fff}
.elc.dmg{background:#fdecea;border-color:#f3b8b3;color:#b3261e}
.elc.nonf{background:var(--acc-l);border-color:#bcd3ee;color:var(--acc)}
.legend2{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin:0 0 10px}
.legend2 span{display:inline-flex;align-items:center;gap:4px}
.legend2 i{width:14px;height:14px;border-radius:4px;display:inline-block}
.gi{background:#fff;border-radius:16px;box-shadow:var(--sh1);padding:10px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}
.gi .th{width:120px;height:90px;border-radius:10px;background:#e8ebe7 center/cover no-repeat;flex:none;display:grid;place-items:center;color:var(--sub);font-size:12px;border:0;padding:0}
.gi .bd{flex:1;min-width:0}
.gi .memo{white-space:pre-wrap;font-size:14px;line-height:1.45}
.gi .no{font-size:12px;color:var(--sub);margin-bottom:2px}
.gi .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.gi .acts button{min-height:40px;font-size:13px;padding:4px 10px}
.gi.done{box-shadow:inset 4px 0 0 var(--acc),var(--sh1)}
.pstrip{display:flex;gap:6px;overflow-x:auto;margin:2px 0 8px;padding-bottom:2px;scrollbar-width:none}
.pstrip button{flex:none;width:84px;height:62px;border-radius:10px;padding:0;border:0;background:#ddd center/cover no-repeat;position:relative}
.pstrip button span{position:absolute;left:3px;bottom:3px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;border-radius:6px;padding:1px 5px}
.pslbl{font-size:12px;color:var(--sub);margin:6px 4px 4px;display:flex;align-items:center;gap:4px}
/* 写真を見る・カメラ */
#pv{position:fixed;inset:0;z-index:75;background:rgba(10,14,12,.96);color:#fff;display:flex;flex-direction:column}
.pvtop{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
.pvtop .sp,.camtop .sp{flex:1}
#pv button{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.2)}
#pv button.pri{background:var(--acc);border-color:var(--acc)}
.pvimg{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;gap:6px;padding:0 6px}
.pvimg img{max-width:calc(100% - 110px);max-height:100%;object-fit:contain;border-radius:6px}
.pvimg .nav{min-width:46px;min-height:80px;font-size:28px}
.pvcap{padding:10px 16px calc(14px + env(safe-area-inset-bottom));font-size:15px;white-space:pre-wrap;text-align:center;opacity:.9}
#cam{position:fixed;inset:0;z-index:85;background:#000}
#camv,#camov{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#camov{pointer-events:none;opacity:.45}
.camtop{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:linear-gradient(rgba(0,0,0,.55),transparent)}
.camtop button,.cambot button{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.25)}
.camid{color:#fff;font-weight:700;background:rgba(29,95,168,.92);border-radius:12px;padding:4px 10px;font-size:14px}
.cambot{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:24px;padding:16px 16px calc(20px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;flex-wrap:wrap}
.cambot .op{display:flex;flex-direction:column;font-size:12px;gap:4px}
.cambot input[type=range]{width:200px}
.shot{width:76px;height:76px;border-radius:50%;background:#fff!important;border:5px solid rgba(255,255,255,.45)!important;box-shadow:0 0 0 3px #fff inset}
.shot:active{transform:scale(.92)}
.camerr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;color:var(--ink);padding:18px 20px;border-radius:16px;max-width:86%;line-height:1.6;font-size:15px}
.hbtns2{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:-4px 0 14px}
.hbtns2 button{min-height:40px;padding:6px 12px;font-size:14px;background:#fff;border-color:var(--line);box-shadow:var(--sh1)}
.badge{font-size:11px;font-weight:700;border-radius:10px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.badge.warn{background:#fff1e0;color:#b25b00}
.badge.dist{background:var(--acc-l);color:var(--acc)}
.pitem .acts button.ic{padding:6px 10px}
.vchips{display:flex;flex-wrap:wrap;gap:6px}
.vchips button{min-height:40px;padding:6px 12px}
.vchips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.ptable{width:100%;border-collapse:collapse;font-size:14px}
.ptable td{padding:6px;border-bottom:1px solid var(--line)}
#hwbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));z-index:42;background:rgba(255,255,255,.97);border-radius:18px;box-shadow:var(--sh2);padding:10px 12px;max-width:calc(100% - 16px);border:1px solid rgba(0,0,0,.06)}
#hwbar .hwt{display:flex;align-items:center;gap:6px;font-size:15px;margin-bottom:6px}
#hwbar .hwr{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#hwbar .hwr button{min-width:42px;min-height:42px;font-weight:700;font-size:17px;padding:4px 8px}
#hwbar .hwr button.on{background:var(--acc-d);color:#fff;border-color:var(--acc-d)}
#hwbar .hwr button.pri,#hwbar .hwr button.ghost{font-size:14px;font-weight:600}
#hwbar .hwph{margin-top:8px;padding-top:8px;border-top:1px solid rgba(0,0,0,.08)}
#hwbar .hwph .ids{font-size:13px;color:var(--acc-d);font-weight:600}
#hwbar .hwr button.rep,#pop .grades button.rep{color:var(--blue);font-size:14px}
#hwbar .hwr button.rep.on,#pop .grades button.rep.on{background:var(--blue);color:#fff;border-color:var(--blue)}
#hwbar .hwch{font-size:17px;font-weight:700;padding:0 4px}
.hwpad{position:relative;height:118px;border:2px dashed #bcd3ee;border-radius:14px;background:#fbfdff;margin-top:4px;touch-action:none}
.hwpad.big{height:150px;flex:1}
.hwpad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;border-radius:12px;will-change:transform;transform:translateZ(0)}
.hwpad .hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#9fb3c8;font-size:15px;pointer-events:none;white-space:nowrap}
.hwpad:not(.empty) .hint{display:none}
.hwres{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 2px;min-height:34px}
.hwres .hwc{min-width:40px;min-height:40px;font-size:20px;font-weight:800;padding:2px 8px}
.hwres .hwch{font-size:20px;font-weight:800;padding:0 4px}
.hwres .hwsp{width:10px}
.hwres > div{width:100%}
.trch{font-size:96px;font-weight:800;width:120px;text-align:center;color:var(--acc-d);font-family:"Hiragino Sans",sans-serif}
#pop .photorow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 8px}
#pop .photorow .ids{font-weight:700;color:var(--acc);font-size:14px}
.hwpad{touch-action:none}
/* 凡例スタンプのパレット */
#stamps{display:none!important}
#stamps button{border:0;background:transparent;flex-direction:column;gap:2px;font-size:11px;min-width:62px;min-height:58px;padding:4px 6px;border-radius:14px;white-space:nowrap}
#stamps button.on{background:var(--acc-l);color:var(--acc);font-weight:700;box-shadow:inset 0 0 0 2px var(--acc)}
#stamps canvas{width:44px;height:26px}
#stamps .sep{width:1px;align-self:stretch;margin:6px 2px;background:var(--line);flex:none}
#stamps .cdot{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ccd}
#stamps button.con .cdot{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--amber)}
/* 損傷を追加する画面 */
.step{display:flex;align-items:center;gap:8px;margin:16px 0 8px;font-weight:800;font-size:15px}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--acc-d);color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
.step .n.off{background:#cfd5ce}
.step .sv{margin-left:auto;font-weight:600;font-size:13px;color:var(--acc)}
.grp{font-size:12px;color:var(--sub);font-weight:700;margin:10px 0 6px;display:flex;align-items:center;gap:6px}
.grp i{width:10px;height:10px;border-radius:3px;display:inline-block}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px}
.dgrid button{justify-content:flex-start;text-align:left;font-size:14px;padding:6px 10px;min-height:48px;border-left-width:5px;line-height:1.25}
.dgrid button .no{font-size:16px;margin-right:2px}
.dgrid button.on{background:var(--acc-d);color:#fff;border-color:var(--acc-d)}
.dgrid.often button{border-left-color:var(--amber)}
.gbig{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.gbig button{flex-direction:column;min-height:64px;font-size:24px;font-weight:800;gap:0;border-radius:14px}
.gbig button small{font-size:10px;font-weight:500;color:var(--sub)}
.gbig button.on{background:var(--acc-d);color:#fff;border-color:var(--acc-d)}
.gbig button.on small{color:#cfe}
.sz{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.sz label{display:flex;flex-direction:column;font-size:12px;color:var(--sub);gap:3px;font-weight:700}
.sz input{width:110px;font-size:18px;text-align:center}
.sz .x{font-size:20px;color:var(--sub);padding-bottom:10px}
.pre{background:#f6f8f5;border-radius:14px;padding:10px 14px;font-family:"Hiragino Sans",monospace;font-size:16px;line-height:1.6;color:var(--red);margin-top:14px;border:1px dashed #d9ded8}
.pre .lbl{display:block;font-size:11px;color:var(--sub);font-family:inherit}
.cpick{display:flex;gap:6px}
.cpick button{min-height:36px;padding:4px 12px;font-size:13px}
.cpick button.on{box-shadow:inset 0 0 0 2px currentColor;font-weight:700}
/* 詳しく直す画面 */
.dlg{position:fixed;inset:0;background:rgba(10,20,15,.38);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.gnit{border:1px solid var(--line);border-radius:14px;padding:10px;margin:8px 0;display:grid;grid-template-columns:230px 1fr;gap:10px;align-items:start;background:#fff}.gnit.off{opacity:.45}.gnit canvas{width:230px;height:150px;border-radius:8px;border:1px solid var(--line);background:#fff}.gnit .t{font-weight:700;font-size:14px;margin-bottom:4px}.gnit .rd{font-size:12px;color:var(--mut)}.gnit input[type=text]{width:100%;margin:3px 0}.gnit .g5 button{min-width:34px;min-height:32px;padding:2px 6px;margin:1px}.gnit .g5 button.on{background:var(--acc);color:#fff;border-color:var(--acc)}.gnsec{font-weight:800;margin:14px 0 2px;color:var(--acc-d)}@media (max-width:640px){.gnit{grid-template-columns:1fr}.gnit canvas{width:100%}}
.sheet{background:var(--paper);width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;box-shadow:var(--sh2)}
.sheet:before{content:"";display:block;width:44px;height:5px;border-radius:5px;background:#d9ded8;margin:0 auto 10px}
@media (min-width:900px){.dlg{align-items:center}.sheet{border-radius:24px}.sheet:before{display:none}}
.sheet h3{margin:4px 0 10px;font-size:19px;display:flex;align-items:center;gap:8px}
.sheet h3 .x{margin-left:auto;border:0;background:#f0f2ef;border-radius:50%;min-width:40px;min-height:40px;padding:0}
.sec{margin:14px 0}
.sec .lb{font-size:12px;color:var(--sub);margin-bottom:6px;font-weight:700;letter-spacing:.05em}
.ln{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap;background:#f6f8f5;border-radius:14px;padding:8px}
.ln input.t{flex:1;min-width:180px}
.ln .cols{display:flex;gap:4px}
.ln .cols button{min-width:30px;min-height:30px;width:30px;height:30px;padding:0;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #d0d6cf}
.ln .cols button.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--amber)}
.grades{display:flex;gap:5px;align-items:center;flex-wrap:wrap;width:100%}
.grades .pv{font-size:13px;color:var(--sub);margin-right:2px}
.grades button{min-width:46px;font-weight:800;font-size:18px;padding:4px;border-radius:12px}
.grades button.on{background:var(--acc-d);color:#fff;border-color:var(--acc-d)}
.dmggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.dmggrid button{justify-content:flex-start;text-align:left;font-size:14px;padding:6px 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--acc-l);border-radius:20px;padding:4px 5px 4px 12px;font-weight:700;color:var(--acc)}
.chip button{min-height:28px;min-width:28px;padding:0;border-radius:50%;border:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.foot{display:flex;gap:8px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.small{font-size:13px;color:var(--sub)}
.warnbox{background:#fff6e6;border:1px solid #f6d79c;border-radius:12px;padding:9px 12px;font-size:14px;margin:8px 0}
</style>
</head>

<script>
// 調書作成システム 読み取り部分(画面に依存しない)
'use strict';

// ---- 設定(会社や様式で変わる部分はここに集める) -------------------------
const CONFIG = {
  layerFrame: 'D-TTL-LINE',        // 損傷図を囲む四角
  layerView: '視点タイトル',        // どこの損傷図か
  layerPhoto: '写真番号',           // 写真ID(0202H014 など)
  layerTokki: '特記なき損傷',       // 特記なき損傷のまとめ文
  // 旗揚げとして扱わないレイヤー
  ignoreLayers: ['写真番号', '特記なき損傷', '野帳_文字メモ', '野帳_情報', '視点タイトル', '凡例', 'タイトル',
                 '色分け表示', 'TTL', 'D-TTL-TXT', 'D-MTR', 'STR-TXT', 'D-MTR-LINE'],
  spanAxis: 'col',                 // 径間ブロックの並び:'col'=左から右(列)、'row'=上から下(行)
  photoMaxDist: 60,                // 旗揚げと写真IDを結びつける最大距離
};

// ---- DXFの読み込み -------------------------------------------------------
function decodeBuffer(buf) {
  let t = new TextDecoder('utf-8').decode(buf);
  const head = t.slice(0, 300000);
  const bad = (head.match(/�/g) || []).length;
  if (bad > 20) {
    try { t = new TextDecoder('shift_jis').decode(buf); } catch (e) { /* そのまま */ }
  }
  return t;
}

function parseDXF(text) {
  const lines = text.split(/\r?\n/);
  const n = lines.length;
  const ents = [];
  let section = null, expectName = false, cur = null, insertCount = 0;
  const layerColors = {};
  let lay = null;
  const KEEP = { MTEXT: 1, TEXT: 1, LWPOLYLINE: 1, LINE: 1 };   // LINE は画面で図面を描くためだけに使う
  const flush = (li) => { if (cur) { cur.li1 = li; ents.push(cur); cur = null; } };   // li0〜li1: 元のDXFの行番号(変換で使う)
  for (let i = 0; i + 1 < n; i += 2) {
    const code = lines[i].trim();
    const val = lines[i + 1];
    if (code === '0') {
      const v = val.trim();
      if (section === 'ENTITIES') flush(i);
      if (lay && lay.name) layerColors[lay.name] = lay.color;
      lay = (section === 'TABLES' && v === 'LAYER') ? { name: '', color: 7 } : null;
      if (v === 'SECTION') { expectName = true; continue; }
      if (v === 'ENDSEC') { section = null; continue; }
      if (section === 'ENTITIES') {
        if (v === 'INSERT') insertCount++;
        if (KEEP[v]) cur = { type: v, li0: i, layer: '', color: null, x: 0, y: 0, hasXY: false, xs: [], ys: [], chunks: [], t: '' };
      }
      continue;
    }
    if (expectName && code === '2') { section = val.trim(); expectName = false; continue; }
    if (lay) { if (code === '2') lay.name = val.trim(); else if (code === '62') lay.color = Math.abs(parseInt(val, 10)); continue; }
    if (!cur) continue;
    switch (code) {
      case '8': cur.layer = val.trim(); break;
      case '62': cur.color = parseInt(val, 10); break;
      case '40': cur.h = parseFloat(val); break;
      case '44': cur.ls = parseFloat(val); break;
      case '71': cur.att = parseInt(val, 10); break;
      case '5': cur.handle = val.trim(); break;
      case '10':
        if (cur.type === 'LWPOLYLINE') cur.xs.push(parseFloat(val));
        else if (!cur.hasXY) cur.x = parseFloat(val);
        break;
      case '20':
        if (cur.type === 'LWPOLYLINE') cur.ys.push(parseFloat(val));
        else if (!cur.hasXY) { cur.y = parseFloat(val); cur.hasXY = true; }
        break;
      case '11': cur.x2 = parseFloat(val); break;
      case '21': cur.y2 = parseFloat(val); break;
      case '1': cur.t = val; break;
      case '3': cur.chunks.push(val); break;
      default: break;
    }
  }
  flush(n);
  // 色が「レイヤーの色(ByLayer)」の文字は、レイヤーの色を使う
  for (const e of ents) if (e.color == null || e.color === 256) e.color = layerColors[e.layer] != null ? layerColors[e.layer] : 7;
  return { ents, insertCount, layerColors };
}

// ---- MTEXTの書式記号を外す(色は1文字ずつ覚えておく) ----------------------
function aciToColor(c) {
  if (c === 1) return 'red';
  if (c === 5) return 'blue';
  return 'black';
}

function mtextToPlain(raw, baseColor) {
  const chars = [];
  const cols = [];
  const stack = [];
  let color = baseColor;
  const put = (ch) => { chars.push(ch); cols.push(color); };
  raw = raw.replace(/\^J/g, '\\P').replace(/\^I/g, ' ');   // 改行が「^J」で書かれている図面もある
  for (let i = 0; i < raw.length; i++) {
    const c = raw[i];
    if (c === '\\') {
      const d = raw[i + 1];
      if (d === undefined) break;
      if (d === 'P' || d === 'X') { put('\n'); i++; continue; }
      if (d === '~') { put(' '); i++; continue; }
      if (d === '\\' || d === '{' || d === '}') { put(d); i++; continue; }
      if ('LlOoKk'.indexOf(d) >= 0) { i++; continue; }
      const j = raw.indexOf(';', i + 2);
      if (d === 'C') {
        if (j > 0) { color = aciToColor(parseInt(raw.slice(i + 2, j), 10)); i = j; continue; }
      }
      if ('FfHWQATpc'.indexOf(d) >= 0) { if (j > 0) { i = j; continue; } }
      if (d === 'S') {
        if (j > 0) { for (const ch of raw.slice(i + 2, j).replace(/[\^#]/g, '/')) put(ch); i = j; continue; }
      }
      put(d); i++; continue;
    }
    if (c === '{') { stack.push(color); continue; }
    if (c === '}') { color = stack.length ? stack.pop() : baseColor; continue; }
    put(c);
  }
  return { text: chars.join(''), colors: cols };
}

function entityText(e) {
  let raw = e.chunks.join('') + e.t;
  if (e.type === 'MTEXT') return mtextToPlain(raw, aciToColor(e.color));
  const t = raw.replace(/\\[A-Za-z][^;]*;/g, '');
  return { text: t, colors: new Array(t.length).fill(aciToColor(e.color)) };
}

// ---- 旗揚げ文字の読み取り -------------------------------------------------
const MEMBER_RE = /([^\d\sA-Za-z,、，→～~\/\n\[\]<>{}：:][^\d\sA-Za-z,、，→～~\/\n<>{}：:]*?)[ 　\t]*([A-Z][a-z])(\d{4})/g;   // 「縦桁 St0107」のように間に空白があってもよい(タテログの書き方)   // 「橋台[竪壁]Ac0101」のように名前の中の[ ]は可
const ITEM_START_RE = /[①-⑳㉑-㉟㊱-㊿]|NON(?=\s*[-－])/g;
const ITEM_RE = /^(?:([①-⑳㉑-㉟㊱-㊿])\s*([^\-－\n]*?)|(NON))\s*[-－]\s*([a-eａ-ｅ])(?:\s*→\s*([a-eａ-ｅ]))?([\s\S]*)$/;
const TAIL_RE = /\s*([,、，]|～|~)\s*(\d{4})/y;

// 損傷の種類の番号と名前(国の点検要領)
const DMG_NAMES = ['腐食', '亀裂', 'ゆるみ・脱落', '破断', '防食機能の劣化', 'ひびわれ', '剥離・鉄筋露出', '漏水・遊離石灰', '抜け落ち', '補修・補強材の損傷',
  '床版ひびわれ', 'うき', '遊間の異常', '路面の凹凸', '舗装の異常', '支承部の機能障害', 'その他', '定着部の異常', '変色・劣化', '漏水・滞水',
  '異常な音・振動', '異常なたわみ', '変形・欠損', '土砂詰まり', '沈下・移動・傾斜', '洗掘'];
// 「⑥床版ひびわれ」のように番号と名前が合っていないものを見つける(タテログの「損傷番号と損傷名の組合せ」の警告)
function dmgNameOk(no, name) {
  if (!no || !name || name === 'NON') return true;
  const ref = DMG_NAMES[no - 1];
  if (!ref) return true;
  const k = (s) => String(s).replace(/[(（［\[【][\s\S]*$/, '').replace(/[・･\s　]/g, '').replace('支承部', '支承');
  const a = k(name), b = k(ref);
  return !a || a === b || (a.length >= 2 && b.indexOf(a) === 0) || a.indexOf(b) === 0;
}
const CIRCLED = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳㉑㉒㉓㉔㉕㉖㉗㉘㉙㉚㉛㉜㉝㉞㉟';
function circledNo(ch) {
  const k = CIRCLED.indexOf(ch);
  return k >= 0 ? k + 1 : null;
}
const fw2hw = (g) => (g ? String.fromCharCode(g.charCodeAt(0) - 0xFF41 + 0x61) : g);
const normGrade = (g) => (g && g >= 'ａ' ? fw2hw(g) : g);

function parseItems(text, colors) {
  const starts = [];
  ITEM_START_RE.lastIndex = 0;
  let m;
  while ((m = ITEM_START_RE.exec(text))) {
    // 「(パターン②)」のように、かっこの中の丸数字は損傷の番号ではない
    const before = text.slice(0, m.index).split('\n').pop();
    const depth = (before.match(/[(（［\[<＜]/g) || []).length - (before.match(/[)）］\]>＞]/g) || []).length;
    if (depth > 0 || /[ﾊパ][ﾟ]?[ﾀタ][ｰー]?[ﾝン]\s*$/.test(before)) continue;
    starts.push(m.index);
  }
  const items = [];
  for (let k = 0; k < starts.length; k++) {
    const s = starts[k];
    const e = k + 1 < starts.length ? starts[k + 1] : text.length;
    let seg = text.slice(s, e);
    let mm = ITEM_RE.exec(seg);
    // 他社の書き方:「⑦剥離・鉄筋露出 - d → d」「①腐食（小小）- b」「⑫うき - e［300×200] → e［400×200］」
    if (!mm || /[(（\[［]/.test(mm[2] || '') || (/→\s*[a-eａ-ｅ]/.test(mm[6]) && !mm[5])) {
      const t = seg.replace(/[（]/g, '(').replace(/[）]/g, ')').replace(/[［]/g, '[').replace(/[］]/g, ']').replace(/[－‐ー](?=\s*[a-eａ-ｅ](?![a-zA-Z]))/g, '-').replace(/[ 　\t]+/g, '');
      const x = /^(?:([①-⑳㉑-㉟㊱-㊿])([^\-(\[\n]*)((?:\([^)]*\)|\[[^\]]*\])*)|(NON))-([a-eａ-ｅ])((?:\([^)]*\)|\[[^\]]*\])*)(?:→([a-eａ-ｅ])((?:\([^)]*\)|\[[^\]]*\])*))?([\s\S]*)$/.exec(t);
      if (x) {
        const det = [x[3], x[8] || x[6], x[9]].filter(Boolean).join('');
        mm = [null, x[1], x[2] || '', x[4], x[5], x[7] || undefined, det + (x[7] && x[6] && x[6] !== x[8] ? '' : '')];
      }
    }
    if (!mm) continue;
    const cs = colors.slice(s, e);
    const color = cs.indexOf('red') >= 0 ? 'red' : (cs.indexOf('blue') >= 0 ? 'blue' : 'black');
    // 「⑥ひびわれ-d→⑫うき-e」:矢印の前は前回の状態(損傷の種類が変わった)
    const changed = /→\s*$/.test(mm[6]);
    items.push({
      changed,
      no: mm[1] ? circledNo(mm[1]) : null,
      name: mm[3] ? 'NON' : mm[2].trim(),
      prev: mm[5] ? normGrade(mm[4]) : null,   // 「c→e」なら 前回=c
      now: normGrade(mm[5] ? mm[5] : mm[4]),   // 「b」だけなら 今回=b
      detail: mm[6].replace(/写真(?:番号)?\s*[-－][\s\S]*$/, '').replace(/→\s*$/, '').replace(/[\s,、，]+$/g, '').replace(/\n/g, ' ').trim(),
      color,
    });
  }
  linkChanged(items);
  return items;
}

// 種類が変わった損傷:前の損傷は今回の行から外し、その程度を次の損傷の「前回」にする
function linkChanged(items) {
  for (let i = 0; i + 1 < items.length; i++) {
    if (items[i].changed) {
      items[i].skip = true;
      items[i].becomes = items[i + 1].name;
      if (!items[i + 1].prev) { items[i + 1].prev = items[i].now; items[i + 1].prevFromChange = true; }
    }
  }
}

function parseElems(first, tail) {
  const els = [first];
  let prev = first;
  let pos = 0, used = 0;
  for (;;) {
    TAIL_RE.lastIndex = pos;
    const m = TAIL_RE.exec(tail);
    if (!m) break;
    const sep = m[1], num = m[2];
    if (sep === '～' || sep === '~') {
      if (prev.slice(0, 2) === num.slice(0, 2) && !prev.includes('～')) {
        for (let v = parseInt(prev, 10) + 1; v <= parseInt(num, 10); v++) els.push(String(v).padStart(4, '0'));
      } else if (prev.slice(2) === num.slice(2) && !prev.includes('～') && +num.slice(0, 2) > +prev.slice(0, 2)) {
        // 「Cr0303～0803」:下2けた(要素の番号)が同じで、上2けた(部材番号)が変わる → 0303, 0403, … 0803
        for (let v = +prev.slice(0, 2) + 1; v <= +num.slice(0, 2); v++) els.push(String(v).padStart(2, '0') + prev.slice(2));
      } else {
        els.pop();
        els.push(prev + '～' + num);
      }
    } else {
      els.push(num);
    }
    prev = num;
    pos = TAIL_RE.lastIndex;
    used = pos;
  }
  return { elements: els, used };
}

// 文字と色を同時に置き換える(色の位置がずれないように)
function substLine(t, c, re, fn) {
  let out = '', oc = [], last = 0, m;
  re.lastIndex = 0;
  while ((m = re.exec(t))) {
    const rep = fn(m);
    out += t.slice(last, m.index) + rep;
    oc = oc.concat(c.slice(last, m.index));
    const col = c[m.index] || 'black';
    for (let i = 0; i < rep.length; i++) oc.push(col);
    last = m.index + m[0].length;
    if (!re.global) break;
    if (m[0].length === 0) re.lastIndex++;
  }
  return { t: out + t.slice(last), c: oc.concat(c.slice(last)) };
}
// タテログの書き方の表記ゆれを、読み取りやすい形にそろえる
function normLine(t, c) {
  let r = { t, c };
  // 「健全」「損傷なし」「損傷無し」「損傷無」= 損傷なし(NON-a)
  r = substLine(r.t, r.c, /(?:健全|損傷な[しい]|損傷無し?)(?!\s*[-－]\s*[a-eａ-ｅ])/g, () => 'NON-a');
  // 「⑤-1防食機能の劣化-e」= 分類1
  r = substLine(r.t, r.c, /([①-⑳㉑-㉟])\s*[-－]\s*(\d)(?=[^\d\-－\s])([^\-－\n]*?)\s*([-－]\s*[a-eａ-ｅ](?:\s*→\s*[a-eａ-ｅ])?)/g, (m) => m[1] + m[3] + m[4] + '(分類' + m[2] + ')');
  // 行頭の「：」(コロン区切りで損傷を並べる書き方)
  r = substLine(r.t, r.c, /^\s*[：:]\s*/g, () => '');
  return r;
}

function parseBlock(plain, cols) {
  const L = [];
  let off = 0;
  for (const ln of plain.split('\n')) {
    const n = normLine(ln, cols.slice(off, off + ln.length));
    L.push({ t: n.t, c: n.c });
    off += ln.length + 1;
  }
  const groups = [];
  const stray = [];
  let curSet = [];
  let curHas = false;
  let lastG = null;   // いちばん最後に出てきた部材
  for (const line of L) {
    const t = line.t;
    const ms = [...t.matchAll(MEMBER_RE)];
    if (ms.length === 0) {
      // 前の行の損傷の続き(「[W=8.0/L=1400]<パターン1>」のように、定量値やパターンだけの行)
      if (/^\s*[\[［<＜]/.test(t) && !/[①-⑳㉑-㉟]/.test(t) && curSet.length) {
        const last = curSet[curSet.length - 1].items.slice(-1)[0];
        if (last) { last.detail = (last.detail ? last.detail + ' ' : '') + t.trim(); continue; }
      }
      const items = parseItems(t, line.c);
      if (items.length && /^\s*→/.test(t) && curSet.length) {
        const last = curSet[curSet.length - 1].items.slice(-1)[0];
        if (last && !last.skip) { last.changed = true; linkChanged([last, items[0]]); }
      }
      if (items.length) {
        if (curSet.length) { curSet.filter((g) => !g.arrowFrom).forEach((g) => g.items.push(...items)); curHas = true; }
        else stray.push(t);
      }
      continue;
    }
    let prevG = null, prevInlineStart = 0;
    // 「落橋防止システムSf0601」の次の行が「→落橋防止構造Ss0601」:前の行の部材から、この行の部材への付け替え(同じ行の「A→B」と同じ)
    const lineArrow = /^\s*→/.test(t) && !curHas && lastG && curSet.includes(lastG) && !lastG.items.length;
    for (let k = 0; k < ms.length; k++) {
      const m = ms[k];
      const afterName = m.index + m[0].length;
      const { elements, used } = parseElems(m[3], t.slice(afterName));
      const inlineStart = afterName + used;
      const inlineEnd = k + 1 < ms.length ? ms[k + 1].index : t.length;
      if (curHas) { curSet = []; curHas = false; }
      const g = { name: m[1].trim().replace(/^【[^】]*】/, ''), symbol: m[2], elements, items: [], arrowFrom: false, from: '' };
      // 「A→B」は、タテログの出力に合わせて矢印の先(B)だけに損傷を付ける
      if (prevG && curSet.includes(prevG) && t.slice(prevInlineStart, m.index).includes('→')) {
        prevG.arrowFrom = true;
        g.from = prevG.name + prevG.symbol + prevG.elements.join(',');
        g.fromSymbol = prevG.symbol;
      } else if (k === 0 && lineArrow) {
        lastG.arrowFrom = true;
        g.from = lastG.name + lastG.symbol + lastG.elements.join(',');
        g.fromSymbol = lastG.symbol;
      }
      groups.push(g); lastG = g;
      curSet.push(g);
      prevG = g; prevInlineStart = inlineStart;
      if (inlineEnd > inlineStart) {
        const items = parseItems(t.slice(inlineStart, inlineEnd), line.c.slice(inlineStart, inlineEnd));
        if (items.length) { curSet.filter((x) => !x.arrowFrom).forEach((x) => x.items.push(...items)); curHas = true; }
      }
    }
  }
  let photoM = null;
  for (const m of plain.matchAll(/写真(?:番号)?\s*[-－]?\s*([0-9][0-9,，、 ]*)?(?:\(\s*([0-9][0-9, ]*)\s*\))?/g)) { if (m[1] || m[2]) { photoM = m; break; } }
  let reportPhotos = [], prevPhotos = [];
  let photoUnset = false;
  if (photoM && (photoM[1] || photoM[2])) {
    reportPhotos = (photoM[1] || '').split(/[,，、\s]+/).filter(Boolean);
    // 「写真-5(12)」「写真-0,0(12,13)」:かっこの中は前回写真の番号(タテログの書き方)
    prevPhotos = (photoM[2] || '').split(/[,\s]+/).filter(Boolean);
    if (reportPhotos.length && reportPhotos.every((x) => /^0+$/.test(x))) photoUnset = true;
  }
  return { groups, stray, reportPhotos, prevPhotos, photoUnset };
}

// ---- 全体の組み立て -------------------------------------------------------
const PHOTO_ID_RE = /\d{4}[A-Za-z]{1,3}\d{2,4}/g;   // 0202H014・0709KI325 など(撮影者は1〜3文字)


// ---- 写真IDと旗揚げの結びつけ(全体でいちばん無理のない組み合わせ) ---------
function hungarian(a, N) {          // a は 1始まりの N×N 費用表。戻り値 p[j]=行
  const INF = 1e18;
  const u = new Array(N + 1).fill(0), v = new Array(N + 1).fill(0);
  const p = new Array(N + 1).fill(0), way = new Array(N + 1).fill(0);
  for (let i = 1; i <= N; i++) {
    p[0] = i;
    let j0 = 0;
    const minv = new Array(N + 1).fill(INF);
    const used = new Array(N + 1).fill(false);
    do {
      used[j0] = true;
      const i0 = p[j0];
      let delta = INF, j1 = 0;
      for (let j = 1; j <= N; j++) {
        if (!used[j]) {
          const cur = a[i0][j] - u[i0] - v[j];
          if (cur < minv[j]) { minv[j] = cur; way[j] = j0; }
          if (minv[j] < delta) { delta = minv[j]; j1 = j; }
        }
      }
      for (let j = 0; j <= N; j++) {
        if (used[j]) { u[p[j]] += delta; v[j] -= delta; } else minv[j] -= delta;
      }
      j0 = j1;
    } while (p[j0] !== 0);
    do { const j1 = way[j0]; p[j0] = p[j1]; j0 = j1; } while (j0);
  }
  return p;
}

// 旗揚げの「写真」の行の位置(写真IDの文字はふつうこの行の右に置く)
function photoAnchor(f) {
  if (f._anchor) return f._anchor;
  const lines = f.raw.split('\n');
  let k = lines.findIndex((t) => /写真/.test(t));
  if (k < 0) k = lines.length;
  const pitch = (f.h || 2.5) * 1.667 * (f.ls || 1);
  f._anchor = { x: f.x, y: f.y - k * pitch - (f.h || 2.5) / 2 };
  return f._anchor;
}
// 写真IDの文字と旗揚げの距離:旗揚げの基準点と「写真」の行の近いほう
function labelDist(l, f) { const an = photoAnchor(f); return Math.min(Math.hypot(l.x - f.x, l.y - f.y), Math.hypot(l.x - an.x, l.y - an.y)); }
function assignPhotos(flags, labels) {
  // まず「写真-」の行のすぐ右(同じ高さ)に置かれた写真IDの文字は、その旗揚げのものと決める(変換した図面の置き方)
  const onLine = new Set();
  labels.forEach((l) => {
    if (!l.ids.length) return;
    let best = null, bd = Infinity, second = Infinity;
    flags.forEach((f) => {
      const an = photoAnchor(f), h = f.h || 2.5, dx = l.x - an.x, dy = Math.abs(l.y - (an.y + h / 2));
      if (dy > h * 0.6 || dx < h * 2 || dx > h * 30) return;
      const d = dx + dy * 10;
      if (d < bd) { second = bd; bd = d; best = f; } else if (d < second) second = d;
    });
    if (best && second - bd > (best.h || 2.5) * 3) { l.flag = best; l.how = 'line'; best.photoIds.push(...l.ids); best.labels.push(l); onLine.add(best); }
  });
  labels = labels.filter((l) => !l.flag);
  flags = flags.filter((f) => !onLine.has(f));
  // 旗揚げ側の「欲しい写真の数」= 報告書の写真番号の数(000は1枚分)
  const slots = [];
  flags.forEach((f) => {
    const need = f.blk.photoUnset ? 1 : f.blk.reportPhotos.length;   // 写真番号が未設定(写真- / 写真XXX)の旗揚げは0。下で近さで結びつける
    for (let k = 0; k < need; k++) slots.push(f);
  });
  const units = [];
  labels.forEach((l) => l.ids.forEach((id) => units.push({ label: l, id })));
  const N = Math.max(slots.length, units.length);
  if (N === 0) return;
  const PAD = 1e6;
  const a = [null];
  for (let i = 1; i <= N; i++) {
    const row = [0];
    for (let j = 1; j <= N; j++) {
      if (i <= units.length && j <= slots.length) {
        row.push(labelDist(units[i - 1].label, slots[j - 1]));
      } else row.push(PAD);
    }
    a.push(row);
  }
  const p = hungarian(a, N);
  const votes = new Map();            // label -> Map(flag -> 件数)
  for (let j = 1; j <= N; j++) {
    const i = p[j];
    if (i > units.length || j > slots.length) continue;
    const u = units[i - 1], f = slots[j - 1];
    const d = labelDist(u.label, f);
    if (d > CONFIG.photoMaxDist) continue;
    if (!votes.has(u.label)) votes.set(u.label, new Map());
    const m = votes.get(u.label);
    m.set(f, (m.get(f) || 0) + 1);
  }
  for (const [lab, m] of votes) {     // 1つの写真ラベルは1つの旗揚げにまとめる
    let best = null, bc = -1, bd = Infinity;
    for (const [f, c] of m) {
      const d = labelDist(lab, f);
      if (c > bc || (c === bc && d < bd)) { best = f; bc = c; bd = d; }
    }
    lab.flag = best; lab.how = 'match';
    best.photoIds.push(...lab.ids);
    best.labels.push(lab);
  }
  // 残った写真番号の文字:いちばん近い旗揚げに付ける(写真番号を後で振る図面向け)。
  // 距離の上限は図面の縮尺に合わせ、旗揚げと写真番号の距離の中央値から決める
  const rest = labels.filter((l) => !l.flag && l.ids.length);
  if (!rest.length || !flags.length) return;
  const near = (l) => { let b = null, bd = Infinity; flags.forEach((f) => { const d = labelDist(l, f); if (d < bd) { bd = d; b = f; } }); return { f: b, d: bd }; };
  const ds = labels.filter((l) => l.ids.length).map((l) => near(l).d).sort((a, b) => a - b);
  const lim = Math.max(CONFIG.photoMaxDist, ds[Math.floor(ds.length / 2)] * 2.5);
  rest.forEach((l) => {
    const n = near(l);
    if (n.f && n.d <= lim) { l.flag = n.f; l.how = 'near'; n.f.photoIds.push(...l.ids); n.f.labels.push(l); }
  });
}

// 写真IDの文字のうち、「写真-」の行の右に置かれていないもので、ほかの旗揚げもほぼ同じくらい近いものに印を付ける(出力前の点検で知らせる)
function markUnsurePhotos(flags, labels) {
  labels.forEach((l) => {
    if (!l.flag || !l.ids.length || l.how === 'line') return;
    const d1 = labelDist(l, l.flag), h = l.flag.h || 2.5;
    let d2 = Infinity, nf = null;
    flags.forEach((f) => { if (f === l.flag) return; const d = labelDist(l, f); if (d < d2) { d2 = d; nf = f; } });
    if (nf && (d2 - d1 < h * 0.6 || (l.how === 'near' && d2 - d1 < h * 2))) { l.unsure = true; l.alt = nf; }
  });
}

// 旗揚げの「写真」の行の右に写真番号の文字が置かれている、として1対1で結びつける
function assignByPhotoLine(flags, labels) {
  // 「XXXXXXXXX」のような写真未設定の文字も、写真なしの枠として結びつける
  const L = labels.filter((l) => l.ids.length || /^X{3,}([,、]X{3,})*$/i.test(l.text.replace(/\s/g, '')));
  if (!L.length || !flags.length) return;
  const anchor = (f) => {
    const lines = f.raw.split('\n');
    let k = lines.findIndex((t) => /写真/.test(t));
    if (k < 0) k = lines.length;
    const pitch = (f.h || 2.5) * 1.667 * (f.ls || 1);
    return { x: f.x, y: f.y - k * pitch - (f.h || 2.5) / 2 };
  };
  const A = flags.map(anchor);
  // 横方向のずれ(写真番号の文字が「写真-」の右にどれだけ離れているか)は図面ごとに違うので、近いもの同士から中央値で決める
  const dxs = L.map((l) => { let b = 0, bd = Infinity; A.forEach((a) => { const d = Math.hypot(l.x - a.x, l.y - a.y); if (d < bd) { bd = d; b = l.x - a.x; } }); return b; }).sort((a, b) => a - b);
  const mdx = dxs[Math.floor(dxs.length / 2)];
  const N = Math.max(L.length, flags.length);
  const a = [null];
  for (let i = 1; i <= N; i++) {
    const row = [0];
    for (let j = 1; j <= N; j++) {
      if (i <= L.length && j <= flags.length) {
        const dx = L[i - 1].x - (A[j - 1].x + mdx), dy = L[i - 1].y - A[j - 1].y;
        row.push(Math.abs(dx) + 3 * Math.abs(dy));
      } else row.push(1e6);
    }
    a.push(row);
  }
  const p = hungarian(a, N);
  const lim = Math.max(CONFIG.photoMaxDist, Math.abs(mdx) * 4);
  for (let j = 1; j <= N; j++) {
    const i = p[j];
    if (i > L.length || j > flags.length) continue;
    const l = L[i - 1], f = flags[j - 1];
    if (Math.hypot(l.x - A[j - 1].x - mdx, l.y - A[j - 1].y) > lim) continue;
    l.flag = f; f.photoIds.push(...l.ids); f.labels.push(l);
    // 「写真-」の行のすぐ右(いつもの位置)にあるものは確か。離れているものは、出力前の点検で「迷う」に入りうる
    { const h = f.h || 2.5, ddx = Math.abs(l.x - A[j - 1].x - mdx), ddy = Math.abs(l.y - (A[j - 1].y + h / 2)); l.how = ddx <= h * 4 && ddy <= h * 0.8 ? 'line' : 'match'; }
    if (!l.ids.length) f.placeholder = true;
  }
}

// 画面で追加した旗揚げの置き場所:その枠の左上から下へ並べる。文字の高さと画層は図面の旗揚げに合わせる
function placeExtra(src, extra, frames) {
  const hs = [], lay = {};
  for (const e of src) {
    if (e.type !== 'MTEXT' || CONFIG.ignoreLayers.includes(e.layer) || e.layer === CONFIG.layerFrame) continue;
    const t = e.chunks.join('') + e.t;
    MEMBER_RE.lastIndex = 0;
    if (!MEMBER_RE.test(t)) continue;
    MEMBER_RE.lastIndex = 0;
    if (e.h) hs.push(e.h);
    lay[e.layer] = (lay[e.layer] || 0) + 1;
  }
  hs.sort((a, b) => a - b);
  const layer = Object.keys(lay).sort((a, b) => lay[b] - lay[a])[0] || '0';
  const cnt = {};
  for (const x of extra) {
    let f = frames.find((fr) => fr.no === x.addedFrame) || frames[0];
    let x0 = f.x0, y1 = f.y1, w = f.x1 - f.x0, hgt = f.y1 - f.y0;
    if (f.noFrame) {
      let a = Infinity, b = -Infinity, c = Infinity, d = -Infinity;
      for (const e of src) if (e.hasXY && isFinite(e.x)) { a = Math.min(a, e.x); b = Math.max(b, e.x); c = Math.min(c, e.y); d = Math.max(d, e.y); }
      if (!isFinite(a)) { a = 0; b = 100; c = 0; d = 100; }
      x0 = a; y1 = d; w = b - a || 100; hgt = d - c || 100;
    }
    const h = hs.length ? hs[Math.floor(hs.length / 2)] : hgt * 0.015;
    const k = cnt[f.no] = (cnt[f.no] || 0) + 1;
    const tl = x.t.split('\\P');
    const lines = tl.length + 1;
    x.layer = layer; x.h = h;
    // 図面の文字と重ならない場所を、枠の左上から順に探す
    const bw = Math.max(8, ...tl.map((t) => t.length + 2)) * h, bh = lines * h * 1.7;
    const boxes = textBoxes(src, f.noFrame ? null : f).concat(extra.filter((o) => o !== x && o.placed).map((o) => o.box));
    const hit = (a) => boxes.some((b) => a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0);
    let best = null;
    for (let cx = x0 + w * 0.02; cx + bw <= x0 + w * 0.98 && !best; cx += Math.max(w * 0.04, h * 4)) {
      for (let cy = y1 - hgt * 0.03; cy - bh >= y1 - hgt * 0.97; cy -= h * 1.5) {
        const a = { x0: cx - h, x1: cx + bw + h, y0: cy - bh - h, y1: cy + h };
        if (!hit(a)) { best = { x: cx, y: cy }; break; }
      }
    }
    if (!best) best = { x: x0 + w * 0.03 + Math.floor((k - 1) / 4) * w * 0.25, y: y1 - hgt * 0.08 - ((k - 1) % 4) * h * (lines + 2) * 1.5 };
    x.x = best.x; x.y = best.y; x.placed = true;
    x.box = { x0: best.x, x1: best.x + bw, y0: best.y - bh, y1: best.y };
  }
}
// 文字のおおよその範囲(重ならない場所を探すため)
function textBoxes(src, f) {
  const out = [];
  for (const e of src) {
    if ((e.type !== 'MTEXT' && e.type !== 'TEXT') || !e.hasXY) continue;
    if (f && (e.x < f.x0 || e.x > f.x1 || e.y < f.y0 || e.y > f.y1)) continue;
    const t = (e.chunks.join('') + e.t).replace(/\\[ACcFfHhQqTtWwp][^;\\]*;/g, '').replace(/[{}]/g, '');
    const L = e.type === 'MTEXT' ? t.split(/\\P|\^J/) : [t];
    const h = e.h || 2.5;
    const wd = Math.max(1, ...L.map((s) => s.length)) * h * 1.0, ht = L.length * h * (e.ls || 1) * 1.67;
    const a = e.att || 1, col = (a - 1) % 3, row = Math.floor((a - 1) / 3);
    const x0 = e.x - wd * col / 2, y1 = e.type === 'TEXT' ? e.y + h : e.y + ht * row / 2;
    out.push({ x0, x1: x0 + wd, y0: y1 - ht, y1 });
  }
  return out;
}

// 部材名のまとめ置き換え(CONFIG.memberMap = { '頂版|Tc': { name: '床版', sym: 'Ds' } }):カルバートの部材名を橋梁の部材名にする、など
function mapMembers(text) {
  const M = CONFIG.memberMap; if (!M || !Object.keys(M).length) return text;
  return text.replace(MEMBER_RE, (all, name, sym, digits) => {
    const pre = (name.match(/^(?:[;；{}\\]|【[^】]*】)*/) || [''])[0], nm = name.slice(pre.length).trim();
    const to = M[nm + '|' + sym];
    return to && (to.name || to.sym) ? pre + (to.name || nm) + (to.sym || sym) + digits : all;
  });
}
// 色:1文字ずつの色 → 行ごとの色(赤=新規・進行、青=補修済み、黒=変化なし)
function lineColorsOf(text, colors) {
  const out = []; let off = 0;
  text.split('\n').forEach((ln) => { const cs = colors.slice(off, off + ln.length); out.push(cs.indexOf('red') >= 0 ? 'red' : cs.indexOf('blue') >= 0 ? 'blue' : 'black'); off += ln.length + 1; });
  return out;
}
function colorsFromLines(text, lc) {
  const out = []; text.split('\n').forEach((ln, i) => { for (let k = 0; k < ln.length; k++) out.push(lc[i] || 'black'); out.push('black'); });
  out.pop(); return out;
}
// 画面で直した文字の目印:文字の置いてある位置
function fixKeyOf(e) { return Math.round(e.x * 100) / 100 + ',' + Math.round(e.y * 100) / 100; }
// 野帳アプリで現場で確かめたこと(NON-aの要素・現地状況写真の写真ID)。「野帳_情報」レイヤーの文字に書いてある
function parseYacho(ents) {
  const out = { non: [], gen: [], shots: [] };
  let found = false;
  (ents || []).forEach((e) => {
    if (e.type !== 'MTEXT' || e.layer !== '野帳_情報') return;
    const raw = (e.chunks || []).join('') + (e.t || '');
    const ls = raw.split('\\P');
    if (ls[0].trim() !== 'YACHO1') return;
    found = true;
    ls.slice(1).forEach((l) => {
      const a = l.trim().split(/\s+/);
      if (a[0] === 'N' && a.length >= 3) out.non.push({ span: a[1], key: a[2] });
      else if (a[0] === 'T' && a.length >= 3) out.shots.push({ id: a[1], t: +a[2] * 1000 });
      else if (a[0] === 'G' && a.length >= 3) out.gen.push({ uid: a[1], ids: a[2].split(',').filter(Boolean), idx: a[3] != null && a[3] !== '-' ? +a[3] : null, memo: a.length > 4 ? a.slice(4).join(' ').replace(/\\~/g, ' ') : '' });
    });
  });
  return found ? out : null;
}

function analyze(dxf) {
  const { insertCount } = dxf;
  const yacho = parseYacho(dxf.ents);
  // 画面で追加した旗揚げ(CONFIG.extraFlags):図面の文字と同じように読む。位置は枠が決まってから入れる
  const extra = (CONFIG.extraFlags || []).filter((a) => a && a.text && String(a.text).trim()).map((a) => ({
    type: 'MTEXT', layer: '', color: 7, x: 0, y: 0, hasXY: true, xs: [], ys: [], chunks: [], ls: 1,
    t: String(a.text).replace(/\\/g, '＼').replace(/\r?\n/g, '\\P'), added: a.uid, addedIds: (String(a.photoIds || '').match(PHOTO_ID_RE) || []), addedFrame: +a.frameNo || 1,
  }));
  const ents = extra.length ? dxf.ents.concat(extra) : dxf.ents;
  const layerOf = (e) => e.layer;

  // 枠(損傷図を囲む四角)
  const frames = [];
  for (const e of ents) {
    if (e.type === 'LWPOLYLINE' && layerOf(e) === CONFIG.layerFrame && e.xs.length >= 3) {
      frames.push({ x0: Math.min(...e.xs), y0: Math.min(...e.ys), x1: Math.max(...e.xs), y1: Math.max(...e.ys) });
    }
  }
  frames.sort((a, b) => (b.y1 - a.y1) || (a.x0 - b.x0));
  // 損傷図の枠がない図面(他社の図面など)は、図面全体を1つの枠として扱う
  if (!frames.length) frames.push({ x0: -1e15, y0: -1e15, x1: 1e15, y1: 1e15, noFrame: true });
  frames.forEach((f, i) => { f.no = i + 1; f.title = f.noFrame ? '損傷図(枠なし)' : ''; });
  if (extra.length) placeExtra(dxf.ents, extra, frames);
  // 径間ブロック:枠を左から右の列に分ける(タテログの「損傷図の径間ブロックの位置(左から右へ配置)」)
  let blk = 0;
  if (CONFIG.spanAxis === 'row') {
    // 行並び:上から順に径間1、2…(1径間分の枠は下をそろえて横に並べる)
    let rowBottom = Infinity;
    frames.slice().sort((a, b) => b.y1 - a.y1).forEach((f) => {
      const h = f.y1 - f.y0;
      if (f.y1 < rowBottom + h * 0.2) { blk++; rowBottom = f.y0; } else rowBottom = Math.min(rowBottom, f.y0);
      f.block = blk;
    });
  } else {
    let colRight = -Infinity;
    frames.slice().sort((a, b) => a.x0 - b.x0).forEach((f) => {
      const w = f.x1 - f.x0;
      if (f.x0 > colRight - w * 0.2) { blk++; colRight = f.x1; } else colRight = Math.max(colRight, f.x1);
      f.block = blk;
    });
  }
  const frameOf = (x, y) => {
    for (const f of frames) if (x >= f.x0 && x <= f.x1 && y >= f.y0 && y <= f.y1) return f;
    return null;
  };

  // 視点タイトル
  for (const e of ents) {
    if (layerOf(e) === CONFIG.layerView && (e.type === 'TEXT' || e.type === 'MTEXT')) {
      const f = frameOf(e.x, e.y);
      if (f && !f.title) f.title = entityText(e).text.replace(/\s+/g, '').trim();
    }
  }

  // 旗揚げ候補・特記なき損傷
  const flags = [];
  const unread = [];
  const notes = [];
  const isNote = (t) => /^[①-㉟][-－]?[a-eA-E](→[a-eA-E])?([〈<(（][^〉>)）]*[〉>)）])*$/.test(String(t).replace(/\s+/g, '')) || String(t).replace(/\r?\n/g, ' ').split(/\s*\/\s*|\s+/).filter(Boolean).every((w) =>
    /^[\[［(（]?[WwLl]?=?[\d.,]+(mm|m)?([×xX*][\d.,]+(mm|m)?)*[\]］)）]?$/.test(w) || /^[WwLl]=[\d.,]+(mm|m)?[,，]?$/.test(w) ||
    /^[①-㉟][-－]?[a-eA-E](→[a-eA-E])?([〈<(（][^〉>)）]*[〉>)）])*$/.test(w) || /^[〈<](not)?fall[〉>]$/i.test(w) || /^前回点検年度[:：]/.test(w) || /^[\d.]+\/[\d.]+$/.test(w));
  const memberNames = {};      // 図面に出てくる部材名|記号 → 数(部材名のまとめ置き換えの一覧に使う)
  const tokki = [];
  // 部材名だけの文字と、損傷の行だけの文字が別々に置かれている図面:近くのものをつなげる
  const cand = [];
  for (const e of ents) {
    if (e.type !== 'MTEXT') continue;
    const lay = layerOf(e);
    if (lay === CONFIG.layerTokki) { tokki.push(e); continue; }
    if (CONFIG.ignoreLayers.includes(lay)) {
      // 「※特記なき損傷」の文字が、凡例など別のレイヤーに置かれていることがある:見出しと部材・損傷があれば、特記なき損傷として読む
      if (lay !== '写真番号' && lay !== '野帳_文字メモ' && lay !== '野帳_情報') {
        const tx = entityText(e).text;
        MEMBER_RE.lastIndex = 0; const okM = MEMBER_RE.test(tx); MEMBER_RE.lastIndex = 0;
        ITEM_START_RE.lastIndex = 0; const okI = ITEM_START_RE.test(tx); ITEM_START_RE.lastIndex = 0;
        if (/特記なき損傷/.test(tx) && okM && okI) { e.__tokkiLayer = lay; tokki.push(e); }
      }
      continue;
    }
    const et = entityText(e);
    MEMBER_RE.lastIndex = 0;
    const hasMem = MEMBER_RE.test(et.text); MEMBER_RE.lastIndex = 0;
    ITEM_START_RE.lastIndex = 0;
    const hasIt = ITEM_START_RE.test(et.text); ITEM_START_RE.lastIndex = 0;
    cand.push({ e, lay, et, hasMem, hasIt, tails: [], used: false });
  }
  // 文字の高さ:図形の高さ(コード40)より、文字の中の \H 指定が大きいことがある
  const hOf = (c) => { const m = /\\H([\d.]+)x?;/.exec(c.e.chunks.join('') + c.e.t); return Math.max(c.e.h || 0, m ? parseFloat(m[1]) : 0) || 2.5; };
  // 損傷の行だけの文字を、上から順に、すぐ上(1〜2行分)にある部材名入りの文字(またはそれにつながった行)へつなげる
  const anchors = cand.filter((c) => c.hasMem).map((c) => ({ c, root: c, x: c.e.x, y: c.e.y, h: hOf(c) }));
  cand.filter((c) => c.hasIt && !c.hasMem).sort((a, b) => b.e.y - a.e.y).forEach((t) => {
    const h = hOf(t);
    let best = null, bd = Infinity;
    anchors.forEach((an) => {
      const dy = an.y - t.e.y, dx = Math.abs(an.x - t.e.x);
      if (dy > h * 0.3 && dy <= h * 2.6 && dx <= h * 4) { const d = dy + dx; if (d < bd) { bd = d; best = an; } }
    });
    if (best) { best.root.tails.push(t); t.used = true; anchors.push({ c: t, root: best.root, x: t.e.x, y: t.e.y, h }); }
  });
  for (const c of cand) {
    if (c.used) continue;
    const e = c.e, lay = c.lay;
    let { text, colors } = c.et;
    if (c.tails.length) {
      c.tails.sort((a, b) => b.e.y - a.e.y).forEach((t) => { text += '\n' + t.et.text; colors = colors.concat(['black'], t.et.colors); });
    }
    // 画面で直した文字(CONFIG.textFixes):図面の文字が直したときのままなら、直した文字で読む
    const fk = e.added ? null : fixKeyOf(e);
    let fixedFrom = null;
    const fx = fk && CONFIG.textFixes ? CONFIG.textFixes[fk] : null;
    const srcText = text;
    if (fx && fx.from === text && fx.to != null) {
      fixedFrom = text; const c0 = colors;
      text = String(fx.to).replace(/\r\n?/g, '\n');
      if (Array.isArray(fx.colors)) colors = colorsFromLines(text, fx.colors);
      else colors = text.split('').map((ch, i) => (ch === '\n' ? 'black' : c0[Math.min(i, c0.length - 1)] || 'black'));
    }
    for (const m of text.matchAll(MEMBER_RE)) { const k = m[1].trim().replace(/^【[^】]*】/, '') + '|' + m[2]; memberNames[k] = (memberNames[k] || 0) + 1; }
    let mapped = false;
    if (!e.added) { const t2 = mapMembers(text); if (t2 !== text) { colors = colorsFromLines(t2, lineColorsOf(text, colors)); text = t2; mapped = true; } }
    const lineColors = lineColorsOf(text, colors);
    const f = frameOf(e.x, e.y);
    const blk = parseBlock(text, colors);
    const hasItems = blk.groups.some((g) => g.items.length);
    if (!hasItems) {
      // 図の中の注記(ひびわれ幅「0.2」「0.2 / L=900」、寸法「300×50×20」、床版ひびわれの略記「⑪-c→c〈1〉」、〈fall〉など)は旗揚げではない
      if (isNote(text)) { notes.push({ layer: lay, frameNo: f ? f.no : null, text: text.replace(/\n/g, ' / ').trim(), x: e.x, y: e.y }); continue; }
      unread.push({ layer: lay, frameNo: f ? f.no : null, text: text.replace(/\n/g, ' / ').trim(), raw: text, src: srcText, fk, fixedFrom, lineColors, e, x: e.x, y: e.y });
      continue;
    }
    flags.push({ fk, fixedFrom, mapped, rewrite: fixedFrom != null || mapped, src0: srcText, lineColors, added: e.added || null, id: flags.length + 1, kind: '旗揚げ', layer: lay, x: e.x, y: e.y, h: e.h || 0, hEff: hOf(c), ls: e.ls || 1, frame: f, raw: text, blk, photoIds: [], labels: [], src: [e].concat(c.tails.map((t) => t.e)) });
  }

  // 写真ID(全体でいちばん無理のない組み合わせで旗揚げに結びつける)
  const photoLabels = [];
  for (const e of ents) {
    if (e.type === 'MTEXT' && layerOf(e) === CONFIG.layerPhoto) {
      const { text } = entityText(e);
      photoLabels.push({ x: e.x, y: e.y, text: text.replace(/\s+/g, ' ').trim(), ids: text.match(PHOTO_ID_RE) || [], flag: null, e });
    }
  }
  // 写真番号が図面に振られていない(写真- / 写真XXX)旗揚げが多いときは、「写真」の行の位置で結びつける
  const unnumbered = flags.filter((f) => f.frame && !f.blk.reportPhotos.length).length;
  const realFlags = flags.filter((f) => !f.added);
  if (unnumbered > realFlags.filter((f) => f.frame).length / 2) assignByPhotoLine(realFlags.filter((f) => f.frame), photoLabels);
  else assignPhotos(realFlags, photoLabels);
  markUnsurePhotos(realFlags, photoLabels);
  flags.forEach((f) => { if (f.added) { f.photoIds = f.src[0].addedIds.slice(); f.labels = []; } });

  // 写真IDの重複

      lines = lines.filter((l) => l.read.text || l.strokes.length);

      // ---- 引出線(新規の旗揚げ) ----
      const adds = [], taken = new Set();
      longs.filter((s) => !used.has(s) && s.D > hc * 4).forEach((s) => {
        const e0 = s.pts[0], e1 = s.pts[s.pts.length - 1];
        let best = null;
        const texty = (l) => l.strokes.length >= 2 && (l.box.x1 - l.box.x0) > hc * 0.9 && /\d|[a-e]/.test(l.read.text);
        [[e0, e1], [e1, e0]].forEach(([te, tip]) => {
          lines.forEach((l) => { if (taken.has(l) || !texty(l)) return; const d = boxDist(l.box, te); const sc = d - l.strokes.length * hc * 0.05; if (d < hc * 3 && (!best || sc < best.sc)) best = { d, sc, l, te, tip }; });
        });
        if (!best || Math.hypot(best.tip[0] - best.te[0], best.tip[1] - best.te[1]) < hc * 3) return;
        // 縦に並んだ行をまとめる(1つの旗揚げ)
        const blk = [best.l]; taken.add(best.l);
        let grow = true;
        while (grow) {
          grow = false;
          const bb = blk.map((l) => l.box).reduce(ub);
          lines.forEach((l) => {
            if (taken.has(l)) return;
            const xo = Math.min(bb.x1, l.box.x1) - Math.max(bb.x0, l.box.x0);
            const gapV = Math.max(l.box.y0 - bb.y1, bb.y0 - l.box.y1);
            if (xo > -hc && gapV < hc * 1.2 && Math.abs(l.box.x0 - bb.x0) < hc * 4) { blk.push(l); taken.add(l); grow = true; }
          });
        }
        blk.sort((a, b) => b.box.y1 - a.box.y1);
        used.add(s);
        adds.push({ leader: s, tip: best.tip, te: best.te, lines: blk, box: blk.map((l) => l.box).reduce(ub) });
      });

      // ---- 旗揚げへの書き込み ----
      const fl = new Map();
      lines.forEach((l) => {
        if (taken.has(l)) return;
        const cy = (l.box.y0 + l.box.y1) / 2;
        let best = null;
        flags.forEach((f) => {
          const b = f.box;
          if (cy < b.y0 - hc * 1.2 || cy > b.y1 + hc * 0.4) return;
          if (l.box.x1 < b.x0 || l.box.x0 < b.x0 - hc) return;
          const dx = Math.max(0, l.box.x0 - b.x1);
          if (dx > hc * 9) return;
          const dy = Math.max(0, b.y0 - cy, cy - b.y1);
          const sc = dx + dy * 2;
          if (!best || sc < best.sc) best = { sc, f };
        });
        if (best) { taken.add(l); if (!fl.has(best.f.key)) fl.set(best.f.key, { f: best.f, lines: [] }); fl.get(best.f.key).lines.push(l); }
      });
      xOf.forEach((xs, key) => { const f = flags.find((q) => q.key === key); if (!fl.has(key)) fl.set(key, { f, lines: [] }); fl.get(key).x = xs; });

      // ---- 旗揚げごとに中身を決める ----
      const flagItems = [];
      fl.forEach((it) => {
        const f = it.f, n = Math.max(1, f.n || (f.lines || []).length || 1);
        const topC = f.box.y1 - f.h, botC = f.box.y0 + f.h * 0.5, pitch = n > 1 ? (topC - botC) / (n - 1) : f.h * 1.7;
        const lineAt = (y) => Math.max(0, Math.min(n - 1, Math.round((topC - y) / (pitch || 1))));
        const r = { key: f.key, ids: [], grades: {}, dims: {}, x: !!it.x, xStrokes: it.x || [], lines: it.lines, texts: [] };
        it.lines.forEach((l) => {
          const t = l.read.text, li = lineAt((l.box.y0 + l.box.y1) / 2);

            else if (kind === 'letter') { const gi = gradeLineAt(f, li); if (gi >= 0 && r.grades[gi] == null) r.grades[gi] = v; }
          });
        });
        r.unsure = it.lines.some((l) => l.read.unsure || l.read.kanji) || r.x;
        flagItems.push(r);
      });

      // ---- 新規の旗揚げの中身 ----
      const addItems = adds.map((a) => {
        let header = '', dmg = [], ids = [], memo = [];
        a.lines.forEach((l, k) => {
          const t = l.read.text, o = l.read.ocr;
          const hm = /([A-Z][a-z])\s*(\d{4})?/.exec(o || '');
          if (k === 0 && hm) { header = hm[1] + (hm[2] || ''); const rest = t.replace(/^[^0-9]*\d{4}/, ''); if (!/\d/.test(rest)) return; }
          // GoodNotesの読みがないとき(野帳の中で書いたとき):1行目の数字3〜4けた以上は要素番号(部材記号はあとで近くの旗揚げから決める)
          if (k <= 1 && !header && !dmg.length && !o) {
            const dg = (t.match(/\d/g) || []).join('');
            if (dg.length >= 3 && !/(^|\s)\d{1,2}\s*[a-e](\s|$)/.test(t) && !/^[-ー]\s*\d/.test(t)) { header = dg.slice(-4).padStart(4, '0'); return; }
          }

          parseTokens(t, (kind, v) => {
            if (kind === 'photo') { ids.push(v); any = true; }
            else if (kind === 'dmg') lm.push(v);
            else if (kind === 'dim') ld.push(v.w != null ? v.w + ' ' + v.l : [v.a, v.b, v.c].filter(Boolean).join(' '));
          });
          // 寸法([200×200] など)は、同じ行の損傷か、なければ上の行の損傷につける
          if (ld.length && lm.length) lm[lm.length - 1] = (lm[lm.length - 1] + ' ' + ld.join(' ')).trim();
          else if (ld.length && dmg.length) { dmg[dmg.length - 1] += ' ' + ld.join(' '); any = true; }
          if (lm.length) { lm.forEach((x) => dmg.push(x)); any = true; }
          if (!any) memo.push(t);
        });
        return { tip: a.tip, te: a.te, box: a.box, leader: a.leader, header, text: dmg.join(', '), ids, memo, lines: a.lines, unsure: a.lines.some((l) => l.read.unsure || l.read.kanji) || !dmg.length };
      });

      // ---- 残り:状況写真・メモ ----
      const gens = [], memos = [];
      lines.forEach((l) => {
        if (taken.has(l)) return;
        const ids = [];
        parseTokens(l.read.text, (kind, v) => { if (kind === 'photo') ids.push(v); });
        if (!ids.length) (l.read.ocrIds || []).forEach((v) => ids.push(v));
        if (ids.length) gens.push({ ids, line: l, arrow: null });
        else memos.push({ line: l });
      });
      // 状況写真:近くの矢印(長い線ではない細い線)を一緒に見せる → 行のかたまりで十分
      // 損傷の形:引出線にも×にも使っていない長い線
      const shapes = longs.filter((s) => !used.has(s)).map((s) => ({ s, inFrame: !frameBox || boxDist(frameBox, [(s.box.x0 + s.box.x1) / 2, (s.box.y0 + s.box.y1) / 2]) === 0 }));
      return { flags: flagItems, adds: addItems, gens, memos, shapes, hc };
    }

    // 行の文字を細かく分ける:写真番号(-150, -125,126, -K150)・進行(→d)・寸法(0.1/800, 600×50)・損傷(8d)
    function parseTokens(t, cb) {
      let s = String(t || '').normalize('NFKC').replace(/[xX]/g, '×').replace(/[\[\]()]/g, ' ').replace(/\s+/g, ' ').trim();
      // 写真番号
      s = s.replace(/[-ー―‐]\s*([A-Z]?)\s*(\d{2,4})((?:\s*[,.]\s*\d{2,4})*)/g, (m0, ini, a, rest) => {
        cb('photo', { ini, n: a });
        (rest.match(/\d{2,4}/g) || []).forEach((x) => cb('photo', { ini, n: x }));
        return ' ';
      });
      s = s.replace(/→\s*([a-e])/g, (m0, g) => { cb('prog', g); return ' '; });
      s = s.replace(/(\d*\.\d+|\d+)\s*\/\s*(\d+)/g, (m0, w, l) => { cb('dim', { w, l }); return ' '; });
      s = s.replace(/(\d+)\s*×\s*(\d+)(?:\s*×\s*(\d+))?/g, (m0, a, b, c) => { cb('dim', { a, b, c }); return ' '; });
      s = s.replace(/(?:^|\s)(\d{1,2})\s*([a-e])(?=\s|$)([\s\d.×]*)/g, (m0, k, g, rest) => { cb('dmg', (k + g + ' ' + (rest || '').trim()).trim()); return ' '; });

    function gradeIdxs(f) { const out = []; (f.lines || []).forEach((l, i) => { if (/[-－]\s*[a-eａ-ｅ](\s*→\s*[a-eａ-ｅ])?/.test(l.t || '') && /^[①-⑳㉑-㉟]|NON/.test(l.t || '')) out.push(i); }); return out; }
    function nearestGrade(f, li) { const g = gradeIdxs(f); if (!g.length) return -1; let b = g[0]; g.forEach((i) => { if (Math.abs(i - li) < Math.abs(b - li) || (Math.abs(i - li) === Math.abs(b - li) && i <= li)) b = i; }); return b; }
    function gradeLineAt(f, li) { const g = gradeIdxs(f); return g.indexOf(li) >= 0 ? li : -1; }

  }

  function normStk(stks) {   // 覚えるときは 0〜100 の箱に

  // 読み取りを直すとき:あとから付けた写真番号・補修はいったん外して、直したあとに付け直す

  // ---------------- 手書きの欄(ここに書くと読み取る) ----------------
  function makePad(box, opt) {
    var c = box.querySelector('canvas'), g = c.getContext('2d'), strokes = [], cur = null, tm = null, res = null, penSeen = false, dprP = Math.min(window.devicePixelRatio || 1, 2);
    function size() { var r = box.getBoundingClientRect(); c.width = Math.max(1, r.width * dprP); c.height = Math.max(1, r.height * dprP); redraw(); }
    function redraw() {
      g.setTransform(dprP, 0, 0, dprP, 0, 0); g.clearRect(0, 0, c.width, c.height);
      g.strokeStyle = '#16201b'; g.lineWidth = 3.2; g.lineCap = 'round'; g.lineJoin = 'round';
      strokes.forEach(function (s) { g.beginPath(); s.forEach(function (q, i) { if (i) g.lineTo(q[0], q[1]); else g.moveTo(q[0], q[1]); }); if (s.length === 1) g.lineTo(s[0][0] + 0.1, s[0][1]); g.stroke(); });
      box.classList.toggle('empty', !strokes.length);

      if (e.pointerType === 'pen') penSeen = true;

      e.preventDefault(); e.stopPropagation();
      try { c.setPointerCapture(e.pointerId); } catch (x) { /* なし */ }
      clearTimeout(tm); cur = { id: e.pointerId, pts: [at(e)] }; strokes.push(cur.pts); if (box.classList.contains('empty')) box.classList.remove('empty'); g.setTransform(dprP, 0, 0, dprP, 0, 0); g.strokeStyle = '#16201b'; g.lineWidth = 3.2; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); g.moveTo(cur.pts[0][0], cur.pts[0][1]); g.lineTo(cur.pts[0][0] + 0.1, cur.pts[0][1]); g.stroke();
    });
    c.addEventListener('pointermove', function (e) {
      if (!cur || cur.id !== e.pointerId) return; e.preventDefault();
      var n0 = cur.pts.length;
      (e.getCoalescedEvents ? e.getCoalescedEvents() : [e]).forEach(function (ce) { var q = at(ce), l = cur.pts[cur.pts.length - 1]; if (Math.hypot(q[0] - l[0], q[1] - l[1]) >= 1) cur.pts.push(q); });

      if (cur.pts.length > n0) { var P = cur.pts; g.beginPath(); g.moveTo(P[n0 - 1][0], P[n0 - 1][1]); for (var k = n0; k < P.length; k++) g.lineTo(P[k][0], P[k][1]); g.stroke(); }

      if (!strokes.length) { res = null; if (opt.onChange) opt.onChange(null); return; }
      if (!opt.mode) return;
      if (Date.now() - hoverAt < 350) { tm = setTimeout(run, 350); return; }   // まだ書きそう(Pencilが画面のすぐ上にある)
      var my = gen, stks = strokes.map(function (s) { return s.slice(); }), segs = hwSegment(stks), i = 0;
      // 1文字ずつ少しずつ読む(書き始めたら、そこでやめる)

  }

  // ---------------- DXFの書き出し ----------------
  function mtextOf(lines, layerColor) {

  }
  // 写真IDの文字の位置:「写真」の行のすぐ右(調書作成システムがその旗揚げの写真として読む位置)
  function idSpot(x, y, h, lines) {
    var k = photoIdx(lines);
    var lineLen = k < lines.length ? lines[k].t.length : 3;
    return { x: x + Math.min(25, Math.max(3, lineLen + 2)) * h, y: y - k * h * 1.667 };
  }
  function exportRec(rec) {
    var ed = rec.edits || emptyEdits();
    var pr = prepare(rec);
    var dxfR = DREND.parse(pr.text);
    var layColor = function (n) { var l = dxfR.layers[n]; return l ? Math.abs(l.color) : 7; };

      if (mdx || mdy) {

        if (!(e.ids && e.ids.length)) (f.labels || []).forEach(function (l) { if (l.e) textEdits.push({ e: l.e, text: null, x: l.e.x + mdx, y: l.e.y + mdy }); });
      }
      var origLines = f.raw.split('\n');
      var moved = photoIdx(e.lines) !== photoIdx(origLines.map(function (t) { return { t: t }; }));
      // 写真ID
      if ((e.ids && e.ids.length) || moved) {
        var sp = idSpot(f.x + mdx, f.y + mdy, h, e.lines);
        var labs = (f.labels || []).filter(function (l) { return l.e; });
        if (labs.length) {
          textEdits.push({ e: labs[0].e, text: e.ids && e.ids.length ? e.ids.join(',') : null, x: sp.x, y: sp.y });
          if (e.ids && e.ids.length) labs.slice(1).forEach(function (l) { textEdits.push({ e: l.e, text: ' ' }); });
        } else if (e.ids && e.ids.length) {
          extra.push({ type: 'MTEXT', layer: CONFIG.layerPhoto, x: sp.x, y: sp.y, h: h, text: e.ids.join(','), color: 0 });
          need[CONFIG.layerPhoto] = 3;
        }
      }
      if (e.moveOnly) return Object.assign({}, f, { rewrite: false });

        var ACI = { k: 7, r: 1, b: 5 };

    });

    ed.strokes.forEach(function (s) {

    var info = ['YACHO1'];

      if (!g && /^std\d+$/.test(u)) { info.push('G ' + u + ' ' + ids.join(',') + ' - ' + String(GEN_STD[+u.slice(3) - 1] || '').replace(/\s/g, '')); return; }

    Object.keys(ed.omoves || {}).forEach(function (k) {

    return DOUT.exportDrawing(rec.buf, { flags: flags, tokkiEnts: [] }, new Map(), { visTexts: [], textEdits: textEdits, extraEnts: extra, newLayers: newLayers, entMoves: entMoves });
  }
  window.__yacho = { hwApply: function (o) { return hwApply(o); }, hwTarget: function (x, y) { return hwTarget(x, y); }, gnr: function () { return GNR; }, gr: function () { return GR; }, hwSegment: hwSegment, hwRead: function (s, m) { return hwRead(s, m); }, HW: HW, exportRec: exportRec, prepare: prepare, state: function () { return P; }, view: V, SET: SET };

  drawHome();
  if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch (e) { /* なし */ } }
})();

</script>
<script>
// ネット上のページで開いたとき:電波のない現場でも開けるようにする(ホーム画面に追加して使う)
if ('serviceWorker' in navigator && /^https:$|^http:$/.test(location.protocol) && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  // 新しい版がとどいたら「更新」ボタンを出す(書いている途中で勝手に切り替えない)
  var hadCtl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!hadCtl) { hadCtl = true; return; }
    if (document.getElementById('upd')) return;
    var d = document.createElement('div'); d.id = 'upd';
    d.innerHTML = '新しい版の野帳がとどきました <button>更新する</button><button class="no">あとで</button>';
    d.querySelector('button').onclick = function () { d.textContent = '更新しています…'; setTimeout(function () { location.reload(); }, 900); };
    d.querySelector('.no').onclick = function () { d.remove(); };
    document.body.appendChild(d);
  });
  navigator.serviceWorker.register('sw.js').then(function (reg) {
    // 開いたとき・アプリに戻ってきたときに新しい版がないか見に行く(電波がなければ何もしない)
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') reg.update().catch(function () {}); });
  }).catch(function () {});
}
</script>
